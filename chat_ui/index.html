<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeachHelp</title>
<style>
  :root {
    --bg: #ffffff; --side: #f8f7f4; --soft: #f2f0eb; --line: #e7e4dd; --line-strong: #d9d5cc;
    --text: #1f1e1c; --muted: #6f6b64; --faint: #9a958c;
    --accent: #c8623a; --accent-soft: #fbeee7; --ok: #2f8f5b; --warn: #b4541e;
    --shadow: 0 1px 2px rgba(31, 30, 28, .05), 0 6px 24px rgba(31, 30, 28, .06);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* .form label { display: grid } kabi qoidalar hidden'ni bosib ketmasin */
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); display: flex; overflow: hidden;
    font: 15.5px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { flex: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

  /* ---------- sidebar ---------- */
  aside {
    width: 268px; flex: none; background: var(--side); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 12px; gap: 6px; transition: margin .2s ease;
  }
  body.side-closed aside { margin-left: -268px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 12px; }
  .logo {
    width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: #fff;
    display: grid; place-items: center; font: 600 15px/1 var(--serif);
  }
  .brand b { font: 600 18px/1 var(--serif); letter-spacing: .01em; }
  .brand .icon-btn { margin-left: auto; }
  .icon-btn { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
  .icon-btn:hover { background: var(--soft); color: var(--text); }
  .new-chat {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px;
    font-weight: 550; font-size: 14.5px;
  }
  .new-chat .plus { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; }
  .new-chat:hover { background: var(--soft); }
  .side-label { font-size: 12px; color: var(--faint); padding: 14px 10px 4px; font-weight: 600; letter-spacing: .02em; }
  .history { flex: 1; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
  .conv {
    display: flex; align-items: center; gap: 6px; width: 100%; padding: 7px 10px; border-radius: 8px;
    font-size: 14px; color: #3b3935; text-align: left;
  }
  .conv span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .conv:hover, .conv.active { background: var(--soft); }
  .conv .del { opacity: 0; color: var(--faint); padding: 2px; border-radius: 6px; }
  .conv:hover .del { opacity: 1; }
  .conv .del:hover { color: var(--warn); }
  .empty-hist { font-size: 13px; color: var(--faint); padding: 6px 10px; }
  .side-foot { border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 2px; }
  .side-link { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; font-size: 14px; color: #3b3935; width: 100%; text-align: left; }
  .side-link:hover { background: var(--soft); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(47, 143, 91, .15); }
  .dot.wait { background: #d9a13a; animation: pulse 1.2s ease-in-out infinite; }
  .dot.off { background: var(--warn); }
  @keyframes pulse { 50% { opacity: .35; } }
  .status-text { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
  .lang { display: flex; gap: 2px; margin: 4px 10px 2px; padding: 3px; background: var(--soft); border-radius: 9px; width: max-content; }
  .lang button { padding: 3px 10px; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .lang button.on { background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(31,30,28,.1); }

  /* ---------- main ---------- */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  .topbar { height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 14px; flex: none; }
  .topbar .title { font-size: 14px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .open-side { display: none; }
  body.side-closed .open-side { display: grid; }
  #scroll { flex: 1; overflow-y: auto; padding: 0 20px; }
  .col { max-width: 740px; margin: 0 auto; }

  /* welcome */
  .welcome { min-height: calc(100% - 20px); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px 0 30vh; text-align: center; }
  .welcome .logo { width: 44px; height: 44px; border-radius: 13px; font-size: 22px; margin-bottom: 18px; }
  .welcome h1 { font: 400 clamp(28px, 4vw, 38px)/1.2 var(--serif); margin: 0 0 8px; letter-spacing: -.01em; }
  .welcome p { color: var(--muted); margin: 0; }
  body.empty #scroll { display: none; }
  body.empty .composer-wrap { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-10%); }
  body.empty .welcome-slot { display: block; }
  .welcome-slot { display: none; position: absolute; left: 0; right: 0; bottom: calc(50% + 70px); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; padding: 0 16px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border: 1px solid var(--line);
    border-radius: 999px; font-size: 13.5px; color: #45423d; background: #fff; transition: border-color .15s, background .15s;
  }
  .chip:hover { border-color: var(--line-strong); background: var(--side); }
  body:not(.empty) .chips { display: none; }
  .chip .ic { color: var(--accent); }

  /* messages */
  .msg { margin: 22px 0; animation: rise .25s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble { background: var(--soft); padding: 10px 16px; border-radius: 18px 18px 4px 18px; max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { display: grid; grid-template-columns: 30px 1fr; gap: 12px; }
  .bot .logo { width: 28px; height: 28px; border-radius: 8px; font-size: 13px; margin-top: 2px; }
  .bot .meta { font-size: 12.5px; color: var(--faint); margin-bottom: 2px; }
  .bot .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot .text.error { color: var(--warn); }
  .thinking { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); font-size: 14px; }
  .thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s infinite ease-in-out; }
  .thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
  .thinking em { font-style: normal; margin-left: 6px; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-4px); opacity: 1; } }
  .cursor::after { content: ""; display: inline-block; width: 8px; height: 1em; margin-left: 2px; background: var(--accent); vertical-align: text-bottom; border-radius: 2px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .actions { display: flex; gap: 2px; margin-top: 6px; opacity: 0; transition: opacity .15s; }
  .msg:hover .actions, .msg:last-child .actions { opacity: 1; }
  .act { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 7px; font-size: 12.5px; color: var(--muted); }
  .act:hover { background: var(--soft); color: var(--text); }

  /* composer */
  .composer-wrap { padding: 8px 20px 14px; flex: none; }
  .composer {
    max-width: 740px; margin: 0 auto; background: #fff; border: 1px solid var(--line-strong);
    border-radius: 20px; box-shadow: var(--shadow); padding: 12px 12px 10px 16px; transition: border-color .15s, box-shadow .15s;
  }
  .composer:focus-within { border-color: #c9c3b8; box-shadow: 0 1px 2px rgba(31,30,28,.06), 0 10px 30px rgba(31,30,28,.09); }
  textarea {
    width: 100%; resize: none; border: 0; outline: 0; background: none; color: var(--text);
    font: inherit; font-size: 16px; padding: 2px 0 8px; max-height: 200px; min-height: 26px;
  }
  textarea::placeholder { color: var(--faint); }
  textarea:focus-visible { outline: none; }   /* ramka butun composer'da (focus-within) */
  .row { display: flex; align-items: center; gap: 8px; }
  .picker { position: relative; margin-left: auto; }
  .picker-btn { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border-radius: 10px; font-size: 13.5px; color: #45423d; }
  .picker-btn:hover, .picker.open .picker-btn { background: var(--soft); }
  .menu {
    display: none; position: absolute; bottom: calc(100% + 10px); right: 0; z-index: 20; width: 330px; max-width: calc(100vw - 32px);
    max-height: 60vh; overflow-y: auto; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px;
  }
  body.empty .menu { bottom: auto; top: calc(100% + 10px); }
  .picker.open .menu { display: block; animation: rise .15s ease both; }
  .group { padding: 10px 10px 4px; font-size: 11.5px; font-weight: 600; color: var(--faint); letter-spacing: .02em; }
  .item { width: 100%; text-align: left; padding: 8px 10px; border-radius: 9px; display: grid; grid-template-columns: 1fr auto; column-gap: 10px; align-items: center; }
  .item:hover:not(:disabled) { background: var(--side); }
  .item:disabled { opacity: .45; cursor: not-allowed; }
  .item b { font-weight: 550; font-size: 14px; }
  .item small { grid-column: 1; color: var(--muted); font-size: 12.5px; line-height: 1.35; }
  .item .mark { grid-row: 1 / span 2; grid-column: 2; color: var(--accent); font-size: 12px; }
  .send { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; transition: transform .1s, opacity .15s; }
  .send:active { transform: scale(.94); }
  .send:disabled { opacity: .35; cursor: default; }
  .hint { max-width: 740px; margin: 8px auto 0; text-align: center; font-size: 12px; color: var(--faint); }

  /* dialogs */
  dialog { width: min(920px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; border: 1px solid var(--line); border-radius: 16px; color: var(--text); background: #fff; box-shadow: 0 24px 64px rgba(0,0,0,.18); }
  dialog.small { width: min(520px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(31, 30, 28, .32); }
  .dlg-head { display: flex; align-items: center; padding: 16px 20px 6px; }
  .dlg-head h2 { margin: 0; font: 500 20px/1.3 var(--serif); }
  .dlg-head .icon-btn { margin-left: auto; }
  .dlg-body { padding: 4px 20px 20px; font-size: 14px; }
  .dlg-body p { margin: 6px 0 12px; color: var(--muted); }
  .field { display: flex; gap: 8px; margin: 10px 0 6px; }
  .field input { flex: 1; border: 1px solid var(--line-strong); border-radius: 10px; padding: 9px 12px; font: inherit; outline: 0; }
  .field input:focus { border-color: var(--accent); }
  .btn { padding: 9px 14px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 550; font-size: 14px; }
  .btn.ghost { background: var(--soft); color: var(--text); }
  .note { font-size: 13px; color: var(--muted); }
  .note.ok { color: var(--ok); } .note.bad { color: var(--warn); }
  .steps { margin: 8px 0 0; padding-left: 20px; color: #45423d; } .steps li { margin: 3px 0; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: #fff; }
  thead th, thead th:first-child { font-weight: 600; color: var(--muted); font-size: 12px; background: var(--side); }
  tbody tr:last-child td { border-bottom: 0; }
  tr.pref td { background: #fdf7f3; }
  td.best { font-weight: 700; color: var(--accent); }
  .why { margin-top: 14px; } .why h3 { font-size: 14px; margin: 0 0 6px; } .why ul { margin: 0; padding-left: 18px; color: #45423d; } .why li { margin: 3px 0; }

  /* account + API keys (console, like OpenAI / Anthropic) */
  .form { display: grid; gap: 10px; }
  .form label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 550; }
  .form input { border: 1px solid var(--line-strong); border-radius: 10px; padding: 9px 12px; font: inherit; font-size: 15px; color: var(--text); outline: 0; }
  .form input:focus { border-color: var(--accent); }
  .seg { display: flex; gap: 2px; padding: 3px; background: var(--soft); border-radius: 10px; width: max-content; }
  .seg button { padding: 5px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(31,30,28,.1); }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .sub { font-size: 14px; margin: 18px 0 8px; }
  table.keys th, table.keys td { text-align: left; }
  table.keys td.num, table.keys th.num { text-align: right; }
  table.keys code { font-size: 12.5px; }
  table.keys .act { color: var(--warn); }
  .reveal { border: 1px solid #ecc9b6; background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
  .reveal p { margin: 2px 0 8px; color: #6b4a3a; font-size: 13px; }
  .secret { display: flex; gap: 8px; align-items: center; }
  .secret code { flex: 1; min-width: 0; overflow-wrap: anywhere; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  pre.code { position: relative; margin: 8px 0 0; background: #1f1e1c; color: #f2f0eb; border-radius: 12px; padding: 14px 16px; overflow-x: auto; font-size: 12.5px; line-height: 1.55; }
  pre.code .act { position: absolute; top: 8px; right: 8px; color: #c9c3b8; }
  pre.code .act:hover { background: #3b3935; color: #fff; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--text); color: #fff; font-size: 13px; padding: 8px 14px; border-radius: 10px; opacity: 0; transition: .2s; pointer-events: none; z-index: 50; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 760px) {
    /* Telefonda panel boshida yopiq, ochilsa sahifa ustida (side-open) */
    aside { position: fixed; inset: 0 auto 0 0; z-index: 30; box-shadow: var(--shadow); margin-left: -268px; }
    body.side-open aside { margin-left: 0; }
    body.side-closed aside { margin-left: -268px; }
    .open-side { display: grid; }
    body.side-open main::before { content: ""; position: fixed; inset: 0; background: rgba(31,30,28,.25); z-index: 25; }
    #scroll { padding: 0 16px; } .composer-wrap { padding: 8px 16px 12px; }
    body.empty .welcome-slot { bottom: calc(50% + 40px); }
    .welcome .logo { display: none; }
  }
</style>
<script src="config.js"></script>
</head>
<body class="empty">

<aside id="side">
  <div class="brand">
    <div class="logo">T</div><b>TeachHelp</b>
    <button class="icon-btn" id="closeSide" data-i18n-title="closePanel">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
    </button>
  </div>
  <button class="new-chat" id="newChat"><span class="plus"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span data-i18n="newChat"></span></button>
  <div class="side-label" data-i18n="chats"></div>
  <div class="history" id="history"></div>
  <div class="side-foot">
    <button class="side-link" id="resultsBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-i18n="results"></span>
    </button>
    <button class="side-link" id="keysBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 21 2M17 6l3 3M14 9l2 2"/></svg><span data-i18n="apiKeys"></span>
    </button>
    <button class="side-link" id="accountBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span id="accountText" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
    </button>
    <button class="side-link" id="serverBtn"><span class="dot" id="dot"></span><span><span id="serverTitle">Server</span><br><span class="status-text" id="serverText"></span></span></button>
    <div class="lang" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="uz">UZ</button></div>
  </div>
</aside>

<main>
  <div class="topbar">
    <button class="icon-btn open-side" id="openSide" data-i18n-title="openPanel">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
    </button>
    <div class="title" id="convTitle"></div>
  </div>

  <div class="welcome-slot">
    <div class="welcome" style="min-height:0;padding:0">
      <div class="logo">T</div>
      <h1 id="greeting"></h1>
      <p data-i18n="welcomeSub"></p>
    </div>
  </div>

  <div id="scroll"><div class="col" id="chat"></div></div>

  <div class="composer-wrap">
    <form class="composer" id="form">
      <textarea id="input" rows="1" data-i18n-ph="placeholder" autofocus></textarea>
      <div class="row">
        <div class="picker" id="picker">
          <button type="button" class="picker-btn" id="pickerBtn" aria-haspopup="listbox" aria-expanded="false">
            <span id="pickerLabel">…</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="menu" id="menu" role="listbox"></div>
        </div>
        <button class="send" id="send" type="submit" disabled></button>
      </div>
    </form>
    <div class="chips" id="chips"></div>
    <div class="hint" id="hint"></div>
  </div>
</main>

<dialog id="results">
  <div class="dlg-head"><h2 data-i18n="resultsTitle"></h2>
    <button type="button" class="icon-btn" data-close data-i18n-title="close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="dlg-body">
    <p data-i18n-html="resultsIntro"></p>
    <div class="table-wrap"><table id="resultsTable"></table></div>
    <div class="why">
      <h3 data-i18n="summary"></h3>
      <ul data-i18n-html="summaryList"></ul>
    </div>
  </div>
</dialog>

<dialog id="server" class="small">
  <div class="dlg-head"><h2 data-i18n="connectTitle"></h2>
    <button type="button" class="icon-btn" data-close data-i18n-title="close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="dlg-body">
    <p data-i18n="connectIntro"></p>
    <div class="field"><input id="apiInput" placeholder="https://....trycloudflare.com" spellcheck="false"><button class="btn" id="apiSave" data-i18n="connect"></button></div>
    <div class="note" id="apiNote"></div>
    <ol class="steps" data-i18n-html="connectSteps"></ol>
  </div>
</dialog>

<dialog id="account" class="small">
  <div class="dlg-head"><h2 id="authTitle"></h2>
    <button type="button" class="icon-btn" data-close data-i18n-title="close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="dlg-body">
    <form class="form" id="authForm">
      <div class="seg"><button type="button" data-mode="login" data-i18n="signIn"></button><button type="button" data-mode="signup" data-i18n="signUp"></button></div>
      <label><span data-i18n="email"></span><input id="authEmail" type="email" autocomplete="email" required></label>
      <label><span data-i18n="password"></span><input id="authPass" type="password" minlength="8" required></label>
      <label id="codeRow" hidden><span data-i18n="inviteCode"></span><input id="authCode" autocomplete="off"></label>
      <button class="btn" id="authSubmit" type="submit"></button>
      <div class="note" id="authNote"></div>
    </form>
    <div id="profile" hidden>
      <p><span data-i18n="signedInAs"></span> <b id="profileEmail"></b></p>

const PREF = new Set(["sft-lora-v3", "sft-lora-dpo", "sft-lora-dpo-v2", "sft-lora-rlhf", "sft-lora-rlhf-v2",
                      "sft-lora-rlhf-skywork", "sft-lora-rlhf-llm"]);
const ICON = {
  send: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',

};

const $ = id => document.getElementById(id);
const chat = $("chat"), input = $("input"), send = $("send"), scroll = $("scroll");
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

// Backend: 1) ?api=... (Kaggle tunnel), eslab qolinadi; 2) config.js API_BASE; 3) "" — shu server (lokal chat_ui/server.py).
const LOCAL = ["127.0.0.1", "localhost"].includes(location.hostname);
let API = (() => {
  const fromUrl = new URLSearchParams(location.search).get("api");
  if (fromUrl) {   // manzildan faqat api olib tashlanadi (lang qoladi)
    store.set("apiBase", fromUrl);
    const q = new URLSearchParams(location.search); q.delete("api");
    history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : ""));
  }
  return (fromUrl || (LOCAL ? "" : store.get("apiBase", "")) || window.API_BASE || "").replace(/\/+$/, "");
})();

// ?lang=uz yoki ?lang=en havolada bo'lsa, shu til tanlanadi (talabalarga o'zbekcha havola yuborish uchun).
const langParam = new URLSearchParams(location.search).get("lang");
if (langParam === "uz" || langParam === "en") store.set("lang", langParam);
let LANG = store.get("lang", "en") === "uz" ? "uz" : "en";
const t = (key, ...args) => { const v = I18N[LANG][key]; return typeof v === "function" ? v(...args) : v; };
let status = ["", "server", "connecting"], statusN = 0, hintKey = "";

let models = [], current = null, controller = null;
let convs = store.get("convs", []);   // [{id, title, model, messages: [{role, content, model, ms}]}]
let active = null;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function toast(text) {
  const t = $("toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1600);
}
function greeting() {
  const h = new Date().getHours();
  return t(h < 5 ? "night" : h < 12 ? "morning" : h < 18 ? "afternoon" : "evening");
}
function setHint(key) { hintKey = key; $("hint").textContent = key ? t(key) : ""; }

/* ---------- language ---------- */
function applyLang() {
  document.documentElement.lang = LANG;
  for (const e of document.querySelectorAll("[data-i18n]")) e.textContent = t(e.dataset.i18n);
  for (const e of document.querySelectorAll("[data-i18n-html]")) e.innerHTML = t(e.dataset.i18nHtml);
  for (const e of document.querySelectorAll("[data-i18n-ph]")) e.placeholder = t(e.dataset.i18nPh);
  for (const e of document.querySelectorAll("[data-i18n-title]")) { e.title = t(e.dataset.i18nTitle); e.setAttribute("aria-label", e.title); }
  for (const b of document.querySelectorAll("[data-lang]")) b.classList.toggle("on", b.dataset.lang === LANG);
  $("greeting").textContent = greeting() + "!";
  const chips = $("chips");
  chips.replaceChildren();
  for (const q of t("examples")) {
    const c = el("button", "chip");
    c.type = "button";
    const ic = el("span", "ic"); ic.innerHTML = ICON.spark;
    c.append(ic, document.createTextNode(q));
    c.onclick = () => ask(q);
    chips.append(c);
  }
  setStatus(...status);
  setHint(hintKey);
  setBusy(!!controller);
  renderHistory();
  renderAccount();
  if ($("keys").open) openKeys();
  if (current) renderMenu();
  else if (!API && !LOCAL) $("pickerLabel").textContent = t("noServer");
  $("results").querySelector("table").replaceChildren();   // natijalar jadvali yangi tilda qayta chiziladi
}

/* ---------- server status ---------- */
function setStatus(state, titleKey, textKey) {
  status = [state, titleKey, textKey];
  $("dot").className = "dot " + state;
  $("serverTitle").textContent = t(titleKey);
  $("serverText").textContent = textKey === "modelsReady" ? t(textKey, statusN) : t(textKey);
}
async function loadModels(attempt = 1) {
  if (!API && !LOCAL) {
    setStatus("off", "notConnected", "enterLink");
    $("pickerLabel").textContent = t("noServer");
    setHint("hintOff");
    if (attempt === 1) setTimeout(() => $("server").showModal(), 400);
    return;
  }
  setStatus("wait", LOCAL && !API ? "localServer" : "kaggleServer", "connecting");
  try {
    const res = await fetch(API + "/api/models");
    if (!res.ok) throw new Error(res.statusText);
    models = await res.json();
    const saved = store.get("model", null);
    // Standart: yakuniy model (DPO v2); foydalanuvchi boshqasini tanlagan bo'lsa — o'sha.
    current = models.find(m => m.id === saved && m.available) || models.find(m => m.id === "sft-lora-dpo-v2" && m.available)
      || models.find(m => m.available) || models[0];
    renderMenu();
    statusN = models.filter(m => m.available).length;
    setStatus("ok", LOCAL && !API ? "localServer" : "kaggleServer", "modelsReady");
    setHint("hintOk");
  } catch (e) {
    setStatus("wait", "server", "waking");
    $("pickerLabel").textContent = t("reconnecting");
    if (attempt < 20) setTimeout(() => loadModels(attempt + 1), 5000);
    else setStatus("off", "noAnswer", "checkLink");
  }
}

/* ---------- model picker ---------- */
function renderMenu() {
  if (!current) return;
  $("pickerLabel").textContent = current.label;
  const menu = $("menu");
  menu.replaceChildren();
  let group = null;
  for (const m of models) {
    if (m.group !== group) { group = m.group; menu.append(el("div", "group", group)); }
    const b = el("button", "item");
    b.type = "button"; b.disabled = !m.available;
    b.append(el("b", null, m.label), el("span", "mark", m.id === current.id ? "✓" : m.available ? "" : t("notTrained")), el("small", null, m["desc_" + LANG] || m.desc));
    b.onclick = () => { current = m; store.set("model", m.id); togglePicker(false); renderMenu(); input.focus(); };
    menu.append(b);
  }
}
function togglePicker(open) {
  $("picker").classList.toggle("open", open);
  $("pickerBtn").setAttribute("aria-expanded", open);
}

/* ---------- conversations ---------- */
function save() { store.set("convs", convs.slice(0, 50)); }
function renderHistory() {
  const h = $("history");
  h.replaceChildren();
  if (!convs.length) { h.append(el("div", "empty-hist", t("noChats"))); return; }
  for (const c of convs) {
    const b = el("button", "conv" + (active && c.id === active.id ? " active" : ""));
    b.append(el("span", null, c.title));
    const d = el("span", "del"); d.innerHTML = ICON.trash; d.title = t("delete");
    d.onclick = e => { e.stopPropagation(); convs = convs.filter(x => x.id !== c.id); save(); if (active && active.id === c.id) newChat(); else renderHistory(); };
    b.append(d);
    b.onclick = () => openConv(c);
    h.append(b);
  }
}
function newChat() {
  if (controller) controller.abort();
  active = null;
  chat.replaceChildren();
  document.body.classList.add("empty");
  $("greeting").textContent = greeting() + "!";
  $("convTitle").textContent = "";
  renderHistory();
  input.focus();
}
function openConv(c) {
  if (controller) controller.abort();
  active = c;
  document.body.classList.remove("empty");
  chat.replaceChildren();
  c.messages.forEach((m, i) => {
    if (m.role === "user") return addUser(m.content);
    const bot = addBot(m, i);
    m.error ? bot.fail(m.error) : bot.done();
  });
  $("convTitle").textContent = c.title;
  renderHistory();
  scroll.scrollTop = scroll.scrollHeight;
  if (mobile()) document.body.classList.remove("side-open");
}

/* ---------- messages ---------- */
function addUser(text) {
  const wrap = el("div", "msg user");
  wrap.append(el("div", "bubble", text));
  chat.append(wrap);
  return wrap;
}
function addBot(m, idx) {
  const wrap = el("div", "msg");
  wrap.idx = idx;   // active.messages ichidagi o'rni: "Qayta" savolni shu orqali topadi
  const row = el("div", "bot");
  const logo = el("div", "logo", "T");
  const body = el("div");
  const meta = el("div", "meta", m.label || "");
  const text = el("div", "text", m.content || "");
  const actions = el("div", "actions");
  body.append(meta, text, actions);
  row.append(logo, body);
  wrap.append(row);
  chat.append(wrap);
  const api = {
    text, meta, wrap,
    thinking() {
      text.replaceChildren();
      const dots = el("span", "thinking"); dots.append(el("i"), el("i"), el("i"));
      const em = el("em", null, t("thinking")); dots.append(em);
      text.append(dots);
      const start = Date.now();
      api.timer = setInterval(() => { em.textContent = `${t("thinking")} ${Math.round((Date.now() - start) / 1000)} s`; }, 1000);
    },
    stream(s) { clearInterval(api.timer); text.classList.add("cursor"); text.textContent = s; },
    done(ms) {
      clearInterval(api.timer); text.classList.remove("cursor");
      if (ms != null) meta.textContent = `${m.label} · ${(ms / 1000).toFixed(1)} s`;
      actions.replaceChildren();
      const copy = el("button", "act"); copy.innerHTML = ICON.copy + t("copy");
      copy.onclick = () => { navigator.clipboard.writeText(text.textContent).then(() => toast(t("copied"))); };
      actions.append(copy);
      const retry = el("button", "act"); retry.innerHTML = ICON.retry + t("retry");
      retry.onclick = () => regenerate(wrap);
      actions.append(retry);
    },
    fail(msg) {
      clearInterval(api.timer); text.classList.remove("cursor"); text.classList.add("error"); text.textContent = msg;
      actions.replaceChildren();
      const retry = el("button", "act"); retry.innerHTML = ICON.retry + t("retryFail");
      retry.onclick = () => regenerate(wrap);
      actions.append(retry);
    },
  };
  if (m.ms != null) meta.textContent = `${m.label} · ${(m.ms / 1000).toFixed(1)} s`;
  return api;
}

function setBusy(busy) {
  send.innerHTML = busy ? ICON.stop : ICON.send;
  send.setAttribute("aria-label", t(busy ? "stop" : "send"));
  send.disabled = !busy && !input.value.trim();
}

async function generate(question, bot, model) {
  controller = new AbortController();
  setBusy(true);
  bot.thinking();
  const start = Date.now();
  let answer = "", error = null;
  try {
    const res = await fetch(API + "/api/generate", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: model.id, messages: [{ role: "user", content: question }] }), signal: controller.signal,
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
    const reader = res.body.getReader(), dec = new TextDecoder();
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      answer += dec.decode(value, { stream: true });
      bot.stream(answer);
      if (scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 120) scroll.scrollTop = scroll.scrollHeight;
    }
    bot.done(Date.now() - start);
  } catch (e) {
    if (e.name === "AbortError") { bot.done(Date.now() - start); }
    else { error = t("error") + e.message; bot.fail(error); answer = ""; loadModels(); }
  }
  controller = null;
  setBusy(false);
  return { answer, ms: Date.now() - start, error };
}

async function ask(text) {
  text = text.trim();
  if (controller || !text || !current) return;
  if (!active) {
    active = { id: Date.now().toString(36), title: text.length > 42 ? text.slice(0, 42) + "…" : text, messages: [] };
    convs.unshift(active);
    document.body.classList.remove("empty");
    $("convTitle").textContent = active.title;
  }
  const model = current;
  active.messages.push({ role: "user", content: text });
  addUser(text);
  input.value = ""; input.style.height = "auto";
  scroll.scrollTop = scroll.scrollHeight;
  renderHistory();
  const conv = active;
  const bot = addBot({ label: model.label }, conv.messages.length);
  const { answer, ms, error } = await generate(text, bot, model);
  // Xato bo'lsa ham javob o'rni saqlanadi: savol va javoblar tartibi siljimaydi.
  conv.messages.push(error ? { role: "assistant", content: "", label: model.label, error }
                           : { role: "assistant", content: answer, label: model.label, ms });
  save(); renderHistory();
  input.focus();
}

async function regenerate(wrap) {
  if (controller || !active || !current || wrap.idx == null) return;
  const conv = active, idx = wrap.idx, question = conv.messages[idx - 1] && conv.messages[idx - 1].content;
  if (!question) return;
  const bot = addBot({ label: current.label }, idx);
  wrap.replaceWith(bot.wrap);   // yangi javob eskisining joyida
  const { answer, ms, error } = await generate(question, bot, current);
  conv.messages[idx] = error ? { role: "assistant", content: "", label: current.label, error }
                             : { role: "assistant", content: answer, label: current.label, ms };
  save();
}

/* ---------- results ---------- */
async function showResults() {
  const table = $("resultsTable");
  if (!table.rows.length) {
    try {
      const data = await (await fetch("results.json")).json();
      const best = Math.max(...data.models.map(m => m.total[0]));
      const head = el("tr");
      for (const name of [t("colModel"), ...data.tasks, t("colTotal"), t("colLength")]) head.append(el("th", null, name));
      const thead = el("thead"), tbody = el("tbody");
      thead.append(head);
      for (const m of data.models) {
        const tr = el("tr", PREF.has(m.id) ? "pref" : null);
        tr.append(el("td", null, m.title));
        for (const [p, n] of m.scores) tr.append(el("td", null, `${p}/${n}`));
        tr.append(el("td", m.total[0] === best ? "best" : null, `${m.total[0]}/${m.total[1]}`));
        tr.append(el("td", null, `${m.avg_chars} ${t("chars")}`));
        tbody.append(tr);
      }
      table.replaceChildren(thead, tbody);
    } catch (e) {
      table.replaceChildren(el("caption", null, t("resultsFail") + e.message));
    }
  }
  $("results").showModal();
}

/* ---------- server dialog ---------- */
async function connect() {
  const url = $("apiInput").value.trim().replace(/\/+$/, "").replace(/.*[?&]api=/, "");
  const note = $("apiNote");
  if (!/^https?:\/\//.test(url)) { note.className = "note bad"; note.textContent = t("badLink"); return; }
  note.className = "note"; note.textContent = t("checking");
  try {
    const res = await fetch(url + "/api/models");
    if (!res.ok) throw new Error(res.statusText);
    await res.json();
    API = url; store.set("apiBase", url);
    note.className = "note ok"; note.textContent = t("connected");
    setTimeout(() => $("server").close(), 600);
    loadModels();
  } catch (e) {
    note.className = "note bad"; note.textContent = t("connectFail") + "(" + e.message + ")";
  }
}

/* ---------- account and API keys ---------- */
// Frontier konsollaridagidek: UI'da sessiya tokeni (sess_...) bilan hisobga kiriladi va API kalitlar (sk-th-...)
// yaratiladi; dasturlar esa /v1 ga faqat API kalit bilan murojaat qiladi (deploy/hf_space/accounts.py).
let session = store.get("session", null);   // {token, email}
let authMode = "login", afterAuth = null, newKey = null, snipTab = "python";

async function authFetch(path, opts = {}) {
  const res = await fetch(API + path, { ...opts, headers: { "Content-Type": "application/json",
    ...(session ? { Authorization: "Bearer " + session.token } : {}) } });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && session && !path.startsWith("/auth/")) setSession(null);   // sessiya muddati tugagan
  if (!res.ok) throw new Error(res.status === 404 ? t("noAccounts") : typeof data.detail === "string" ? data.detail : res.statusText);
  return data;
}
function setSession(s) { session = s; store.set("session", s); renderAccount(); }
function renderAccount() { $("accountText").textContent = session ? session.email : t("signIn"); }

async function openAuth(mode) {
  if (session) {
    $("authTitle").textContent = t("account");
    $("authForm").hidden = true; $("profile").hidden = false; $("profileEmail").textContent = session.email;
  } else {
    authMode = mode || authMode;
    $("authTitle").textContent = t(authMode === "login" ? "signInTitle" : "signUpTitle");
    $("authForm").hidden = false; $("profile").hidden = true;
    for (const b of document.querySelectorAll("[data-mode]")) b.classList.toggle("on", b.dataset.mode === authMode);
    $("authSubmit").textContent = t(authMode === "login" ? "signIn" : "signUp");
    $("authPass").autocomplete = authMode === "login" ? "current-password" : "new-password";
    $("authNote").textContent = "";
    $("codeRow").hidden = true;
    if (authMode === "signup") authFetch("/auth/config").then(c => { $("codeRow").hidden = !c.signup_code_required; }).catch(() => {});
  }
  if (!$("account").open) $("account").showModal();
}
async function submitAuth(e) {
  e.preventDefault();
  const note = $("authNote");
  note.className = "note"; note.textContent = t("wait");
  try {
    const r = await authFetch("/auth/" + authMode, { method: "POST", body: JSON.stringify({
      email: $("authEmail").value, password: $("authPass").value, code: $("authCode").value }) });
    setSession({ token: r.token, email: r.user.email });
    $("authPass").value = "";
    $("account").close();
    if (afterAuth) { const f = afterAuth; afterAuth = null; f(); }
  } catch (err) { note.className = "note bad"; note.textContent = err.message; }
}
async function logout() {
  authFetch("/auth/logout", { method: "POST" }).catch(() => {});
  setSession(null);
  $("account").close();
}

function fmtDate(ts) {
  return ts ? new Date(ts * 1000).toLocaleString(LANG === "uz" ? "uz-UZ" : "en-US",
    { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : t("never");
}
function fillTable(table, heads, rows, empty) {
  const thead = el("thead"), tbody = el("tbody"), tr = el("tr");
  for (const [h, num] of heads) tr.append(el("th", num ? "num" : null, t(h)));
  thead.append(tr);
  for (const cells of rows) {
    const r = el("tr");
    cells.forEach((c, i) => { const td = el("td", heads[i][1] ? "num" : null); td.append(c); r.append(td); });
    tbody.append(r);
  }
  if (!rows.length) { const r = el("tr"), td = el("td", null, t(empty)); td.colSpan = heads.length; r.append(td); tbody.append(r); }
  table.replaceChildren(thead, tbody);
}
async function openKeys() {
  if (!session) { afterAuth = openKeys; return openAuth("login"); }
  $("reveal").hidden = !newKey;
  $("keysNote").textContent = "";
  renderSnippet();
  if (!$("keys").open) $("keys").showModal();
  try {
    const [keys, usage] = await Promise.all([authFetch("/keys"), authFetch("/usage")]);
    fillTable($("keysTable"), [["colName"], ["colKey"], ["colCreated"], ["colLastUsed"], ["colRequests", 1], ["colTokens", 1], [""]],
      keys.map(k => {
        const rm = el("button", "act", t("revoke"));
        rm.onclick = () => revokeKey(k);
        return [k.name, el("code", null, k.preview), fmtDate(k.created), fmtDate(k.last_used),
                String(k.requests), k.tokens.toLocaleString(), rm];
      }), "noKeys");
    fillTable($("usageTable"), [["colDay"], ["colRequests", 1], ["colPrompt", 1], ["colCompletion", 1]],
      usage.map(u => [u.day, String(u.requests), u.prompt_tokens.toLocaleString(), u.completion_tokens.toLocaleString()]), "noUsage");
  } catch (e) {
    if (!session) { $("keys").close(); afterAuth = openKeys; return openAuth("login"); }
    $("keysNote").className = "note bad"; $("keysNote").textContent = e.message;
  }
}
async function createKey() {
  try {
    const r = await authFetch("/keys", { method: "POST", body: JSON.stringify({ name: $("keyName").value }) });
    newKey = r.key;
    $("newKey").textContent = r.key;
    $("keyName").value = "";
    openKeys();
  } catch (e) { $("keysNote").className = "note bad"; $("keysNote").textContent = e.message; }
}
async function revokeKey(k) {
  if (!confirm(t("revokeConfirm", k.name))) return;
  await authFetch("/keys/" + k.id, { method: "DELETE" }).catch(e => toast(e.message));
  toast(t("revoked"));
  openKeys();
}
function renderSnippet() {
  const base = (API || location.origin) + "/v1", key = newKey || "sk-th-...";
  const model = (models.find(m => m.id === "sft-lora-dpo-v2") || models[0] || { id: "sft-lora-dpo-v2" }).id;
  const q = LANG === "uz" ? "Python nima?" : "What is Python?";
  $("baseUrl").textContent = base;
  for (const b of document.querySelectorAll("[data-snip]")) b.classList.toggle("on", b.dataset.snip === snipTab);
  $("snippet").textContent = {
    curl: `curl ${base}/chat/completions \\\n  -H "Authorization: Bearer ${key}" \\\n  -H "Content-Type: application/json" \\\n` +
          `  -d '{"model": "${model}", "messages": [{"role": "user", "content": "${q}"}]}'`,
    python: `# pip install openai\nfrom openai import OpenAI\n\nclient = OpenAI(base_url="${base}", api_key="${key}")\n` +
            `response = client.chat.completions.create(\n    model="${model}",\n    messages=[{"role": "user", "content": "${q}"}],\n)\n` +
            `print(response.choices[0].message.content)`,
    js: `const res = await fetch("${base}/chat/completions", {\n  method: "POST",\n  headers: { "Authorization": "Bearer ${key}", "Content-Type": "application/json" },\n` +
        `  body: JSON.stringify({ model: "${model}", messages: [{ role: "user", content: "${q}" }] }),\n});\n` +
        `console.log((await res.json()).choices[0].message.content);`,
  }[snipTab];
  $("copySnip").innerHTML = ICON.copy + t("copy");
}

/* ---------- events ---------- */
$("form").onsubmit = e => { e.preventDefault(); if (controller) controller.abort(); else ask(input.value); };
input.oninput = () => {
  input.style.height = "auto"; input.style.height = input.scrollHeight + "px";
  if (!controller) send.disabled = !input.value.trim();
};
input.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); } };
$("pickerBtn").onclick = () => togglePicker(!$("picker").classList.contains("open"));
document.addEventListener("click", e => { if (!$("picker").contains(e.target)) togglePicker(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") togglePicker(false); });
$("newChat").onclick = newChat;
const mobile = () => matchMedia("(max-width: 760px)").matches;
$("closeSide").onclick = () => {
  if (mobile()) document.body.classList.remove("side-open");
  else document.body.classList.add("side-closed");
};
$("openSide").onclick = () => mobile() ? document.body.classList.add("side-open") : document.body.classList.remove("side-closed");
document.querySelector("main").addEventListener("click", e => {
  if (mobile() && document.body.classList.contains("side-open") && !e.target.closest("#openSide")) document.body.classList.remove("side-open");
});
$("resultsBtn").onclick = showResults;
$("serverBtn").onclick = () => { $("apiInput").value = API; $("apiNote").textContent = ""; $("server").showModal(); };
$("apiSave").onclick = connect;
$("apiInput").onkeydown = e => { if (e.key === "Enter") connect(); };
$("accountBtn").onclick = () => openAuth();
$("keysBtn").onclick = () => { newKey = null; openKeys(); };
$("profileKeys").onclick = () => { $("account").close(); newKey = null; openKeys(); };
$("logout").onclick = logout;
$("authForm").onsubmit = submitAuth;
for (const b of document.querySelectorAll("[data-mode]")) b.onclick = () => openAuth(b.dataset.mode);
$("createKey").onclick = createKey;
$("keyName").onkeydown = e => { if (e.key === "Enter") createKey(); };
$("copyKey").onclick = () => navigator.clipboard.writeText(newKey).then(() => toast(t("copied")));
for (const b of document.querySelectorAll("[data-snip]")) b.onclick = () => { snipTab = b.dataset.snip; renderSnippet(); };
$("copySnip").onclick = () => navigator.clipboard.writeText($("snippet").textContent).then(() => toast(t("copied")));
for (const d of document.querySelectorAll("dialog")) {
  d.onclick = e => { if (e.target === d || e.target.closest("[data-close]")) d.close(); };
}
for (const b of document.querySelectorAll("[data-lang]")) {
  b.onclick = () => { LANG = b.dataset.lang; store.set("lang", LANG); applyLang(); };
}
applyLang();
newChat();
loadModels();
</script>
